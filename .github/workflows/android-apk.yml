name: ZEKO Player Release APK

on:
  push:
    branches: ["main", "master", "madlad-translation-integration", "zeko-player-polish"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare clean APK filename
        run: |
          mkdir -p dist
          APK_PATH="$(find . -type f -path '*/build/outputs/apk/release/*release*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found. Available APK files:"
            find . -type f -name '*.apk' -print
            exit 1
          fi
          cp "$APK_PATH" dist/ZEKO-Player.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEKO-Player
          path: dist/ZEKO-Player.apk
          if-no-files-found: error
