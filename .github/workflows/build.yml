name: Build Zeko Player
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZEKO_KEYSTORE_BASE64: ${{ secrets.ZEKO_KEYSTORE_BASE64 }}
      ZEKO_KEYSTORE_PASSWORD: ${{ secrets.ZEKO_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare stable signing key
        if: ${{ env.ZEKO_KEYSTORE_BASE64 != '' && env.ZEKO_KEYSTORE_PASSWORD != '' }}
        run: |
          echo "$ZEKO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zeko-player-upload.p12"
          chmod 600 "$RUNNER_TEMP/zeko-player-upload.p12"
      - name: Build and test APK
        env:
          ZEKO_KEYSTORE_PATH: ${{ runner.temp }}/zeko-player-upload.p12
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Zeko-Player-debug
          path: build/outputs/apk/debug/*.apk
