name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate app icon
        run: |
          mkdir -p src/main/res/drawable src/main/res/mipmap-anydpi-v26 src/main/res/mipmap-anydpi
          cat > src/main/res/drawable/ic_launcher_background.xml << 'EOF2'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#14141A"
                  android:pathData="M0,0h108v108h-108z" />
          </vector>
          EOF2
          cat > src/main/res/drawable/ic_launcher_foreground.xml << 'EOF2'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FF6D00"
                  android:pathData="M54,24 a30,30 0 1,1 0,60 a30,30 0 1,1 0,-60 z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M46,40 L46,68 L70,54 Z" />
          </vector>
          EOF2
          cat > src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF2'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF2
          cat > src/main/res/mipmap-anydpi/ic_launcher.xml << 'EOF2'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@drawable/ic_launcher_background" />
              <item android:drawable="@drawable/ic_launcher_foreground" />
          </layer-list>
          EOF2

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ZekoPlayer-APK
          path: build/outputs/apk/debug/*.apk
